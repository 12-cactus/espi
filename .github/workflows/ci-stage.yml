name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ['24.22.1']

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies 👨🏻‍💻
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Run linter 👀
        run: yarn lint

      - name: Run build 🏗
        run: yarn build

      - name: Run tests 🧪
        run: yarn test

      - name: Run coverage 📊
        run: yarn coverage

      - name: Send Codacy Coverage Report 📈
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
